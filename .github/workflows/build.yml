name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare release keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias qiandaizi \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass qiandaizi123 -keypass qiandaizi123 \
            -dname "CN=Qiandaizi, OU=Mobile, O=Qiandaizi, L=Hangzhou, ST=Zhejiang, C=CN"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Qiandaizi-v1.8.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 钱袋子-APK
          path: Qiandaizi-v1.8.2.apk
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.8.2' }}
          name: 钱袋子 Android v1.8.2
          body: |
            钱袋子原生 Android 客户端（纯 Kotlin + Jetpack Compose，非套壳浏览器）。
            正式签名安装包，下载下方 `Qiandaizi-v1.8.2.apk` 安装即可（安卓 8.0 及以上）。
            本版改进：
            - 图片记账支持现场切换 OCR 类型（自动 / 标准 / 高精度 / 手写 / 网络图 / 含位置）
            - 识别结果来源标注为「百度OCR·标准版」而非「本地规则」
            - 拍照 uri 改用 rememberSaveable 保存，修复相机返回后偶发无反应
          files: Qiandaizi-v1.8.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
